<!doctype html>
<html lang="pl" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Status · Kamil Marczak</title>
    <meta
      name="description"
      content="Stan usług kamilmarczak.pl, sprawdzany niezależnie z kilku źródeł."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0e12" />
    <link
      rel="icon"
      id="favicon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2032%2032'%3E%3Ccircle%20cx%3D'16'%20cy%3D'16'%20r%3D'8'%20fill%3D'%237c8491'%2F%3E%3C%2Fsvg%3E"
    />
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <a class="brand" href="./"
          ><span class="dot st-unknown" id="mark" aria-hidden="true"></span
          ><span id="brandName"></span><span class="sub">status</span></a
        >
        <div class="top-r">
          <span class="when" id="when" role="status"></span>
          <button
            class="ibtn"
            id="refreshBtn"
            data-act="refresh"
            data-i18n-title="refresh"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <path d="M21 3v6h-6" />
            </svg>
          </button>
          <button class="ibtn" id="langBtn" data-act="lang"></button>
          <button class="ibtn" data-act="theme" data-i18n-title="theme">
            <svg
              class="i-sun"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              /></svg
            ><svg
              class="i-moon"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="summary st-unknown" id="summary" aria-live="polite">
        <div class="sum-main">
          <span class="dot"></span>
          <div class="sum-text">
            <h1 id="headline"></h1>
            <p class="lede" id="lede"></p>
          </div>
          <div class="sum-when" id="sumWhen"></div>
        </div>
        <div class="facts" id="facts"></div>
      </section>
      <div id="demo"></div>

      <section class="sec" aria-labelledby="srcTitle">
        <div class="sec-h">
          <h2 id="srcTitle" data-i18n="srcs"></h2>
          <span class="note" data-i18n="srcs_note"></span>
        </div>
        <div class="srcs" id="srcs"></div>
      </section>

      <section class="sec" id="services" aria-labelledby="svcTitle">
        <div class="sec-h">
          <h2 id="svcTitle" data-i18n="services"></h2>
          <span class="note" id="resultNote"></span>
        </div>
        <div class="toolbar">
          <div class="seg" role="group" id="winSeg">
            <button data-act="win" data-win="hour"></button
            ><button data-act="win" data-win="day"></button
            ><button data-act="win" data-win="month"></button>
          </div>
          <label class="search"
            ><span class="sr-only" data-i18n="search"></span
            ><input
              id="q"
              type="search"
              autocomplete="off"
              spellcheck="false"
              data-i18n-ph="search"
            /><kbd id="kbd">⌘K</kbd></label
          >
          <div class="seg" role="group" id="chips"></div>
          <button class="tlink" id="toggleAll" data-act="toggle-all"></button>
        </div>
        <div class="cols" id="cols" aria-hidden="true"></div>
        <div id="list"></div>
      </section>

      <section class="sec" aria-labelledby="incTitle">
        <div class="sec-h">
          <h2 id="incTitle" data-i18n="inc_title"></h2>
          <span class="note" data-i18n="inc_note"></span>
        </div>
        <div id="incidents"></div>
      </section>

      <footer>
        <div class="legend">
          <span class="st-healthy"
            ><i></i><span data-i18n="st_healthy"></span
          ></span>
          <span class="st-degraded"
            ><i></i><span data-i18n="st_degraded"></span
          ></span>
          <span class="st-down"><i></i><span data-i18n="st_down"></span></span>
          <span class="st-unknown"
            ><i></i><span data-i18n="st_unknown"></span
          ></span>
        </div>
        <div>
          <span data-i18n="kb"></span> ·
          <a href="https://kamilmarczak.pl">kamilmarczak.pl</a> ·
          <a href="https://github.com/qamarq/status">Beacon</a>
        </div>
      </footer>
    </main>
    <div id="tip" role="tooltip" aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
